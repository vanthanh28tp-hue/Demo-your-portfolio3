<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Creative Dev</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>I Design & Build <span>Websites</span></h1>
    <p>Frontend Developer | UI Designer</p>
    <button>View My Work</button>
  </div>
</section>

<!-- ABOUT -->
<section class="about">
  <h2>About Me</h2>
  <p>I create modern, clean and responsive websites using HTML, CSS.</p>
</section>

<!-- PROJECTS -->
<section class="projects">
  <h2>My Work</h2>

  <div class="grid">
    <div class="card">Project 1</div>
    <div class="card">Project 2</div>
    <div class="card">Project 3</div>
    <div class="card">Project 4</div>
  </div>
</section>

<!-- CONTACT -->
<section class="contact">
  <h2>Contact</h2>
  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Email">
  <textarea placeholder="Message"></textarea>
  <button class="btn">Send Message</button>
</section>

</body>
</html>
